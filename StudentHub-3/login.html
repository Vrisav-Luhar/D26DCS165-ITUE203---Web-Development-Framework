<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Login to the StudentHub college portal.">

    <title>Login | StudentHub</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<a class="skip-link" href="#main-content">
    Skip to main content
</a>

<header>

    <div class="site-header">

        <div class="site-brand">

            <a href="index.html">

                <h1>StudentHub</h1>

            </a>

            <p>College Student Portal</p>

        </div>


        <nav aria-label="Main navigation">

            <ul class="main-nav">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="events.html">
                        Events
                    </a>
                </li>

                <li>
                    <a href="faq.html">
                        FAQ
                    </a>
                </li>

                <li>
                    <a href="contact.html">
                        Contact
                    </a>
                </li>

                <li>
                    <a href="feedback.html">
                        Feedback
                    </a>
                </li>

                <li>
                    <a href="register.html">
                        Register
                    </a>
                </li>

            </ul>

        </nav>

    </div>

</header>


<main id="main-content">


    <section aria-labelledby="login-heading">

        <h2 id="login-heading">
            Login to StudentHub
        </h2>


        <form action="#"
              method="post">


            <div class="form-group">

                <label for="login-email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="login-email"
                    name="email"
                    autocomplete="email"
                    required>

            </div>


            <div class="form-group">

                <label for="login-password">
                    Password
                </label>

                <input
                    type="password"
                    id="login-password"
                    name="password"
                    autocomplete="current-password"
                    required>

            </div>


            <div class="form-group">

                <label>

                    <input
                        type="checkbox"
                        name="remember">

                    Remember Me

                </label>

            </div>


            <button type="submit">
                Login
            </button>


        </form>


        <p>

            Don't have an account?

            <a href="register.html">
                Create an account
            </a>

        </p>


    </section>


</main>


<footer>

    <div class="footer-content">

        <h2>
            StudentHub
        </h2>

        <p>
            &copy; 2026 StudentHub.
            All rights reserved.
        </p>

    </div>

</footer>

</body>
</html>
