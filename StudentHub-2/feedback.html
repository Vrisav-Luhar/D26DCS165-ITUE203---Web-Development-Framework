<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Submit feedback about StudentHub.">

    <title>Feedback | StudentHub</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<a class="skip-link" href="#main-content">
    Skip to main content
</a>

<header>

    <div class="site-header">

        <div class="site-brand">

            <a href="index.html">

                <h1>StudentHub</h1>

            </a>

            <p>College Student Portal</p>

        </div>


        <nav aria-label="Main navigation">

            <ul class="main-nav">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>
                    <a href="events.html">
                        Events
                    </a>
                </li>

                <li>
                    <a href="faq.html">
                        FAQ
                    </a>
                </li>

                <li>
                    <a href="contact.html">
                        Contact
                    </a>
                </li>

                <li>
                    <a href="feedback.html"
                       aria-current="page">
                        Feedback
                    </a>
                </li>

                <li>
                    <a href="login.html">
                        Login
                    </a>
                </li>

            </ul>

        </nav>

    </div>

</header>


<main id="main-content">


    <section aria-labelledby="feedback-heading">

        <h2 id="feedback-heading">
            StudentHub Feedback
        </h2>

        <p>
            Help us improve StudentHub by sharing
            your feedback.
        </p>


        <form action="#"
              method="post">


            <div class="form-group">

                <label for="feedback-name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="feedback-name"
                    name="name"
                    autocomplete="name"
                    required>

            </div>


            <div class="form-group">

                <label for="feedback-email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="feedback-email"
                    name="email"
                    autocomplete="email"
                    required>

            </div>


            <fieldset>

                <legend>
                    How would you rate StudentHub?
                </legend>


                <label>

                    <input
                        type="radio"
                        name="rating"
                        value="excellent"
                        required>

                    Excellent

                </label>


                <label>

                    <input
                        type="radio"
                        name="rating"
                        value="good">

                    Good

                </label>


                <label>

                    <input
                        type="radio"
                        name="rating"
                        value="average">

                    Average

                </label>


                <label>

                    <input
                        type="radio"
                        name="rating"
                        value="poor">

                    Poor

                </label>


            </fieldset>


            <div class="form-group">

                <label for="feedback">

                    Your Feedback

                </label>

                <textarea
                    id="feedback"
                    name="feedback"
                    rows="6"
                    required></textarea>

            </div>


            <button type="submit">
                Submit Feedback
            </button>


        </form>


    </section>


</main>


<footer>

    <div class="footer-content">

        <h2>
            StudentHub
        </h2>

        <p>
            &copy; 2026 StudentHub.
            All rights reserved.
        </p>

    </div>

</footer>

</body>
</html>
